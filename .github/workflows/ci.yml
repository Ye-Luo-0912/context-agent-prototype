name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Path confinement, junction/reparse handling, shell invocation and
        # process cancellation are platform-sensitive, so the workspace is
        # verified on both Windows and Linux.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (1.97.1, matching local verification)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The context-service binary is a dev-dependency of the adapter crate,
      # so cargo rebuilds it whenever the wire protocol changes; the explicit
      # build keeps the binary fresh for every downstream step regardless.
      - name: cargo build --workspace
        run: cargo build --workspace

      # Closure audits (agent-eval m12/m13) spawn real child processes and
      # journals; at the default concurrency the shared runner exhausts its
      # thread/process budget (tokio worker spawn EAGAIN, flock would-block
      # on inherited fds). Cap concurrent test binaries so the audit keeps
      # headroom on both platforms.
      - name: cargo test --workspace
        run: cargo test --workspace -j 2
