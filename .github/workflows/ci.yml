name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  docs-consistency:
    name: document consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Docs agree with state.json, windows and links
        run: python scripts/doc_consistency.py

  check:
    name: fmt / clippy / build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Path confinement, junction/reparse handling, shell invocation and
        # process cancellation are platform-sensitive, so the workspace is
        # verified on both Windows and Linux.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (1.97.1, matching local verification)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The host's named-pipe backend is cfg(windows)-gated; this scoped
      # Linux check keeps that cfg surface (and the UDS path) compiling so a
      # Windows-only regression cannot hide behind the fmt/clippy ordering.
      - name: cargo check -p agent-host --all-targets
        if: matrix.os == 'ubuntu-latest'
        run: cargo check -p agent-host --all-targets

      # E3 guard: the Linux test shards select crates with explicit -p lists,
      # so a newly added workspace member could silently miss its Linux
      # cargo test run. Compare cargo metadata's workspace members against
      # the shard union parsed from this workflow's test matrix; anything
      # not in a shard must be listed in the script with name and reason.
      - name: Linux test shards cover the workspace
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/ci_shard_consistency.py

      # The context-service package owns its process-boundary integration
      # target and Cargo supplies the exact freshly-built binary through
      # CARGO_BIN_EXE; the workspace build also covers the shipped service.
      - name: cargo build --workspace
        run: cargo build --workspace

  test:
    name: test (${{ matrix.os }}, part ${{ matrix.part }})
    runs-on: ${{ matrix.os }}
    # The check job fills the shared cargo cache, including all --all-targets
    # test artifacts, so the test jobs restore it warm and compile nothing.
    needs: check
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The hosted runner terminates a job at roughly 48 minutes of job wall
        # time ("lost communication"), observed twice at 48m02s/47m59s while
        # the whole Ubuntu suite was still in progress with zero test
        # failures - once at full concurrency, once at -j 2. The full suite
        # needs that much wall time, so a single test job cannot complete it:
        # Ubuntu runs two halves sized from measured per-crate test durations
        # in separate jobs (fresh VMs), while Windows keeps its single
        # full-suite job. The per-binary and per-test-thread caps keep the
        # closure audits (agent-eval m12/m13 spawn real child processes and
        # journals) headroom on the shared runner. The 45-minute job cap is a
        # clean-limit guard below the runner kill point: a part landing near
        # it is a split-balance failure, not a pass.
        include:
          - os: ubuntu-latest
            part: 1
            cargo_pkgs: "-p context-simple -p agent-tui -p agent-workspace -p tool-runtime -p agent-process -p agent-conformance -p agent-replay -p agent-host"
          - os: ubuntu-latest
            part: 2
            cargo_pkgs: "-p agent-runtime -p agent-eval -p agent-contracts -p agent-platform-protocol -p context-baselines -p context-contextcore -p agent-capability-process -p agent-context-service -p agent-storage -p agent-core -p provider-openai -p agent-compose"
          - os: windows-latest
            part: full
            cargo_pkgs: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (1.97.1, matching local verification)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # agent-eval fixture/bench tests probe a real Python 3 interpreter
      # (py -3 / python3 / python) for their deterministic golden runs.
      # Hosted windows runners can expose a Store alias that hangs the probe
      # instead of a working interpreter, so install a known-good one and
      # point AGENT_PYTHON at it — otherwise discovery still walks py -3
      # first and a 5s hang per candidate can fail the golden commands
      # even though setup-python already put a working 3.12 on PATH.
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"

      - name: Point host Python probes at the installed interpreter
        shell: bash
        run: |
          PYTHON_PATH="${{ steps.python.outputs.python-path }}"
          if [ -z "$PYTHON_PATH" ]; then
            echo "setup-python did not report python-path"
            exit 1
          fi
          {
            echo "AGENT_PYTHON<<EOF"
            echo "$PYTHON_PATH"
            echo "EOF"
          } >> "$GITHUB_ENV"
          echo "AGENT_PYTHON=$PYTHON_PATH"

      # A scoped test job selects only its part's crates, so integration
      # tests that spawn sibling binaries (mock_host / broker_host from
      # agent-process) must build them explicitly. The context-service
      # contract suite is owned by the agent-context-service package and uses
      # Cargo's CARGO_BIN_EXE path, so Cargo itself rebuilds the exact binary;
      # no timestamp-based freshness workaround is needed. Part 1 (Ubuntu)
      # contains none of these crates; agent-host is also self-sufficient
      # there — its tests spawn only its own binary through
      # CARGO_BIN_EXE_agent-host, which cargo test builds automatically.
      - name: Build cross-crate test fixtures
        if: matrix.part != 1
        shell: pwsh
        run: |
          cargo build -p agent-process

      # After a full Windows compile, first-start of python.exe can exceed the
      # 5s semantic probe (Defender scanning the interpreter). agent-eval then
      # reports python_interpreter_invalid even when AGENT_PYTHON is the
      # setup-python binary. Run that same isolated probe here so cargo test
      # does not pay the cold start.
      - name: Warm the Python interpreter used by agent-eval probes
        if: matrix.part != 1
        shell: bash
        run: |
          "$AGENT_PYTHON" -I -c "import os,sys; sys.exit(3) if sys.version_info[0] != 3 else print('agent-python-v1:' + os.path.abspath(sys.executable))"

      - name: cargo test (${{ matrix.part }})
        run: cargo test -j 2 ${{ matrix.cargo_pkgs }} -- --test-threads 2

  dotnet:
    name: dotnet (desktop build, client tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET SDK (10.0.301, matching global.json)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301

      # N8: the cross-binary chain test (HostChainTests) drives the REAL
      # debug agent-host under AGENT_DEMO=1; the Rust build makes it run on
      # CI instead of passing as NOT_RUN.
      - name: Install Rust toolchain (1.97.1, matching local verification)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build the debug host (N8 cross-binary chain)
        run: cargo build -p agent-host

      - name: dotnet build (Agent.Desktop)
        run: dotnet build apps/Agent.Desktop/Agent.Desktop.csproj

      - name: dotnet test (Agent.Client.Tests)
        run: dotnet test clients/dotnet/Agent.Client.Tests/Agent.Client.Tests.csproj
