[package]
name = "agent-workspace"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Portable storage-full fault injection for the disk-full recovery fixtures.
# Default builds carry no injection surface; only this package's own tests,
# its crash_probe helper, and fixtures that opt in through the self
# dev-dependency below can arm a plan.
test-faults = []

[dependencies]
agent-contracts.workspace = true
agent-process.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_SystemServices",
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3"
# Self-dependency so integration tests and the crash_probe bin are built
# against this crate with the test-faults feature enabled during test runs.
agent-workspace = { path = ".", features = ["test-faults"] }
