[package]
name = "agent-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
agent-capability-process.workspace = true
agent-contracts.workspace = true
agent-core.workspace = true
agent-runtime.workspace = true
agent-compose.workspace = true
agent-platform-protocol.workspace = true
agent-process.workspace = true
agent-storage.workspace = true
agent-workspace.workspace = true
context-simple.workspace = true
tool-runtime.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
base64.workspace = true
tempfile = "3"

[target.'cfg(windows)'.dev-dependencies]
# The e2e's read watchdog interrupts a parked test-side read with
# CancelIoEx through a duplicate pipe handle.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_IO",
] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
