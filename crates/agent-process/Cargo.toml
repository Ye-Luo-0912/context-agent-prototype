[package]
name = "agent-process"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Generic JSON-lines process host: framed IPC, child lifecycle, deadlines, sandbox hooks for every process-boundary integration"

[dependencies]
agent-contracts.workspace = true
agent-platform-protocol.workspace = true
async-trait.workspace = true
base64.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_JobObjects",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
